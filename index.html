
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lag Test</title>
<style>
* { margin: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}
#label {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: white;
  font: bold 48px Arial;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="label">Lag</div>
<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
let active = true;
const start = performance.now();
const duration = 5 * 60 * 1000;

function resize() {
  canvas.width = Math.min(innerWidth * devicePixelRatio, 1600);
  canvas.height = Math.min(innerHeight * devicePixelRatio, 1000);
}
resize();
addEventListener("resize", resize);

function render(now) {
  if (!active || now - start >= duration) {
    active = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  // Animated graphics workload.
  for (let i = 0; i < 250; i++) {
    ctx.fillStyle = `hsl(${Math.random()*360},100%,50%)`;
    ctx.fillRect(
      Math.random() * canvas.width,
      Math.random() * canvas.height,
      30 + Math.random() * 100,
      30 + Math.random() * 100
    );
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
