function editProfile(){const u=user();openModal('Edit profile',`<label>Username<input class="field" id="profUsername" maxlength="24" value="${esc(u.username)}"></label><label>About me<textarea class="field" id="profBio" maxlength="240" placeholder="A little about you">${esc(u.bio||'')}</textarea></label><label>Profile picture URL<input class="field" id="profAvatarUrl" placeholder="https://…" value="${esc(u.avatar||'')}"></label><label class="file-label">Choose profile image<input id="profAvatarFile" type="file" accept="image/*"><span>Upload an image (under 1.5 MB)</span></label><div class="inline-note">Username rules: 3–24 characters; letters, numbers, underscores and hyphens only.</div><div class="inline-note">Your WebRTC link: <code style="word-break:break-all">${esc(u.rtcId||rtcId(current))}</code><br>This link is locked to your username while you are online, so nobody else can register it.</div>`,()=>{const n=$('profUsername').value.trim(),key=n.toLowerCase(),bio=$('profBio').value.trim(),url=$('profAvatarUrl').value.trim();if(renaming)return;if(!validUsername(n)){toast('Invalid username format.','bad');return}if(key!==current&&has(db.users,key)){toast(TAKEN_MSG,'bad');return}if(url&&!safeImg(url)){toast('Avatar must be an image URL or uploaded image.','bad');return}const apply=()=>{const u=user(),old=current;if(!u)return;if(key!==old){delete db.users[old];db.users[key]=u;current=key;db.session=key;u.rtcId=rtcId(key);renameEverywhere(old,key)}u.username=n;u.bio=bio;u.avatar=url;save();closeModal();renderShell();renderView();toast('Profile updated.','good')};if(key===current){apply();return}renaming=true;claimUsername(key).then(r=>{renaming=false;if(!r.ok){toast(r.reason==='taken'?TAKEN_MSG:OFFLINE_MSG,'bad');return}if(has(db.users,key)){r.peer.destroy();toast(TAKEN_MSG,'bad');return}holdClaim(r.peer,key);apply()})});$('profAvatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1_500_000){toast('Image must be under 1.5 MB.','bad');return}const r=new FileReader();r.onload=()=>{$('profAvatarUrl').value=r.result};r.readAsDataURL(f)} }
function profile(k){const u=db.users[k];if(!u)return;const friend=(user().friends||[]).includes(k);openModal('Profile',`<div class="profile-card"><div class="profile-banner"></div><div class="profile-top"><img class="profile-large" src="${avatar(u)}" alt=""><div><div class="profile-name">${esc(u.username)}</div><div class="profile-tag">@${esc(u.username)}</div></div>${k!==current?`<button class="primary" id="profileFriend">${friend?'Message':(user().sentRequests||[]).includes(k)?'Request sent':'Add friend'}</button>`:''}</div><div class="profile-bio"><strong>About me</strong><div style="margin-top:7px;white-space:pre-wrap">${esc(u.bio||'No description yet.')}</div></div></div>`,null);if(k!==current)$('profileFriend').onclick=()=>{closeModal();if(friend){view={type:'dm',id:k};renderSide();renderView()}else sendFriendRequest(k)}}
function friendSearch(){openModal('Find friends',`<label>Search username<input class="field" id="friendQuery" placeholder="username_without_spaces" autocomplete="off"></label><div id="friendResults" class="setting-block"><div class="inline-note">Search only finds accounts stored in this browser. A real public user directory requires a shared service.</div></div>`,null);$('friendQuery').oninput=renderFriendResults;$('friendQuery').focus()}function renderFriendResults(){const q=$('friendQuery').value.trim().toLowerCase(),out=$('friendResults');if(!out)return;out.innerHTML='';const hits=Object.keys(db.users).filter(k=>k!==current&&db.users[k].username.toLowerCase().includes(q)).slice(0,12);if(!q){out.innerHTML='<div class="inline-note">Type a username to search.</div>';return}if(!hits.length){out.innerHTML='<div class="inline-note">No matching local accounts.</div>';return}hits.forEach(k=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<img src="${avatar(db.users[k])}" style="width:34px;height:34px;object-fit:cover;border-radius:50%"><div style="flex:1"><strong>${esc(db.users[k].username)}</strong><div class="small muted">${esc(db.users[k].bio||'Flapchat user')}</div></div><button class="primary" data-add="${esc(k)}">${user().friends.includes(k)?'Friends':user().sentRequests.includes(k)?'Pending':'Add'}</button><button class="subtle" data-profile="${esc(k)}">Profile</button>`;out.append(row)});out.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>sendFriendRequest(b.dataset.add));out.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{const k=b.dataset.profile;closeModal();profile(k)})}
function sendFriendRequest(k){if(!db.users[k])return;if(k===current)return toast('You cannot add yourself.','bad');if(user().friends.includes(k))return toast('Already friends.');if((user().requests||[]).includes(k)){acceptFriend(k);if($('friendQuery'))renderFriendResults();return}if(user().sentRequests.includes(k))return toast('Request already sent.');user().sentRequests.push(k);db.users[k].requests=db.users[k].requests||[];if(!db.users[k].requests.includes(current))db.users[k].requests.push(current);save();toast('Friend request saved in this browser.','good');if($('friendQuery'))renderFriendResults();renderSide()}
function acceptFriend(k){if(!db.users[k])return;user().friends=user().friends||[];db.users[k].friends=db.users[k].friends||[];if(!user().friends.includes(k))user().friends.push(k);if(!db.users[k].friends.includes(current))db.users[k].friends.push(current);user().requests=user().requests.filter(x=>x!==k);db.users[k].sentRequests=(db.users[k].sentRequests||[]).filter(x=>x!==current);save();renderShell();toast('You are now friends.','good')}
function notificationModal(){const requests=user().requests||[];openModal('Notifications',`<div class="setting-block"><h4>Friend requests</h4>${requests.length?requests.map(k=>`<div>${esc(db.users[k]?.username||k)} <button class="subtle" data-accept="${esc(k)}">Accept</button></div>`).join(''):'<div class="inline-note">No new notifications.</div>'}</div><label class="toggle">Play a sound for notifications<input type="checkbox" id="notifyToggle" ${db.notify?'checked':''}></label>`,()=>{db.notify=$('notifyToggle').checked;save();closeModal()});document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{acceptFriend(b.dataset.accept);closeModal();notificationModal()})}
function settingsModal(){openModal('User settings',`<div class="setting-block"><h4>Appearance</h4><div class="theme-options">${[['galaxy','Galaxy'],['blue','Blue dusk'],['black','Black'],['midnight','Midnight'],['plum','Plum']].map(([v,n])=>`<button class="theme-swatch ${db.theme===v?'active':''}" data-theme="${v}" title="${n}" style="background:${({galaxy:'linear-gradient(135deg,#29294a,#171820)',blue:'linear-gradient(135deg,#263f69,#111824)',black:'#111214',midnight:'linear-gradient(135deg,#1e3040,#101a20)',plum:'linear-gradient(135deg,#452d53,#1b1722)'})[v]}"></button>`).join('')}</div></div><label class="toggle">Play notification sounds<input id="notifyToggle" type="checkbox" ${db.notify?'checked':''}></label><div class="setting-block"><h4>Account</h4><button class="primary" id="editProfileFromSettings">Edit profile</button><button class="primary" id="exportData">Export local data</button><button class="primary" id="importData">Import backup</button><input id="importFile" type="file" accept="application/json" hidden></div><div class="inline-note">This prototype stores account records in localStorage. Passwords are not securely hashed. Do not use real credentials. Data is not synced across browsers or devices.</div>`,()=>{db.notify=$('notifyToggle').checked;save();closeModal()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{db.theme=b.dataset.theme;save();applyTheme();document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b))});$('editProfileFromSettings').onclick=()=>{closeModal();editProfile()};$('exportData').onclick=()=>{const blob=new Blob([JSON.stringify({...db,session:null},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flapchat-backup.json';a.click();URL.revokeObjectURL(url)};$('importData').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!x.users||!x.servers)throw Error();const me=db.users[current];x.dms=x.dms||{};x.theme=x.theme||db.theme;if(x.notify===undefined)x.notify=db.notify;if(!has(x.users,current))x.users[current]=me;db=x;db.session=current;save();closeModal();renderShell();renderView();toast('Backup imported.','good')}catch{toast('That backup file is invalid.','bad')}};r.readAsText(f)}}
function addServerModal(){openModal('Add a server',`<button class="navitem" id="makeServer">${svg('plus')} <span><strong>Create my own</strong><div class="small muted">Start a server on this browser</div></span></button><label>Join with a server invite link<input id="serverInvite" class="field" placeholder="flapchat://server/… or invite code"></label><div class="inline-note">Server links in this prototype only work when the server record is available in the same browser or imported from a backup. Public invites across devices require a shared service.</div>`,()=>{const code=$('serverInvite').value.trim();if(!code)return toast('Enter a server invite link or code.','bad');const id=code.replace(/^flapchat:\/\/server\//i,'');const s=db.servers[id]||Object.values(db.servers).find(x=>x.invite===id);if(!s)return toast('Invite not found in this browser.','bad');if(!user().servers.includes(s.id))user().servers.push(s.id);if(!s.members.includes(current))s.members.push(current);save();closeModal();view={type:'server',id:s.id,channel:Object.keys(s.channels)[0]||'general'};renderShell();renderView()});$('makeServer').onclick=()=>{closeModal();createServerModal()}}
function createServerModal(){openModal('Create a server',`<label>Server name<input class="field" id="newServerName" maxlength="50" placeholder="My community" required></label><label>Description<textarea class="field" id="newServerDesc" maxlength="240" placeholder="What is this server about?"></textarea></label><div class="inline-note">A private server invite is generated. In this prototype, the invite is usable only in this browser unless the underlying data is shared separately.</div>`,()=>{const name=$('newServerName').value.trim();if(!name)return toast('Enter a server name.','bad');const id=uid(),invite=uid()+'-'+uid();db.servers[id]={id,name,description:$('newServerDesc').value.trim(),owner:current,members:[current],invite,icon:'',roles:[{name:'Owner',rank:100,perms:['all']},{name:'Admin',rank:80,perms:['manage','channels','roles']},{name:'Moderator',rank:50,perms:['manageMessages']},{name:'Member',rank:10,perms:[]}],memberRoles:{[current]:'Owner'},channels:{general:{name:'general',topic:'',messages:[],minRole:0}}};user().servers.push(id);save();closeModal();view={type:'server',id,channel:'general'};renderShell();renderView();toast('Server created. Invite: flapchat://server/'+invite,'good')},'Create server')}
function createChannel(server){if(!server||!can(server,'channels'))return toast('You need a higher role to create channels.','bad');openModal('Create channel',`<label>Channel name<input class="field" id="channelName" maxlength="30" placeholder="new-channel"></label><label>Topic<input class="field" id="channelTopic" maxlength="120" placeholder="What is this channel for?"></label><label>Minimum role to send messages<select class="field" id="channelMinRole"><option value="0">Everyone</option><option value="10">Member or higher</option><option value="50">Moderator or higher</option><option value="80">Admin or higher</option><option value="100">Owner only</option></select></label>`,()=>{const name=$('channelName').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-');if(!name)return toast('Enter a channel name.','bad');if(server.channels[name])return toast('Channel already exists.','bad');server.channels[name]={name,topic:$('channelTopic').value.trim(),messages:[],minRole:Number($('channelMinRole').value)};save();closeModal();view.channel=name;renderSide();renderView()},'Create channel')}
function rank(server){const role=server.memberRoles[current]||'Member';return server.roles.find(r=>r.name===role)?.rank||0}function can(server,perm){if(server.owner===current)return true;const role=server.roles.find(r=>r.name===(server.memberRoles[current]||'Member'));return !!role&&(role.perms.includes('all')||role.perms.includes(perm))}
function serverSettings(id){const s=db.servers[id];if(!s)return;const isOwner=s.owner===current;openModal('Server settings',`<label>Server name<input class="field" id="serverNameEdit" maxlength="50" value="${esc(s.name)}" ${can(s,'manage')?'':'disabled'}></label><label>Description<textarea class="field" id="serverDescEdit" maxlength="240" ${can(s,'manage')?'':'disabled'}>${esc(s.description||'')}</textarea></label><label>Server icon URL<input class="field" id="serverIconEdit" value="${esc(s.icon||'')}" placeholder="https://…" ${can(s,'manage')?'':'disabled'}></label><div class="setting-block"><h4>Invite link</h4><div class="row"><input class="field" readonly id="inviteLink" value="flapchat://server/${esc(s.invite)}"><button class="primary" id="copyInvite">Copy</button></div></div><div class="setting-block"><h4>Roles</h4>${s.roles.slice().sort((a,b)=>b.rank-a.rank).map(r=>`<div class="row"><span class="role-pill">${esc(r.name)}</span><span class="small muted">Rank ${r.rank}</span></div>`).join('')} ${can(s,'roles')?'<button class="primary" id="manageRoles">Manage roles and assign members</button>':''}</div>${isOwner?'<button id="deleteServer" class="primary" style="background:#a53f50">Delete server</button>':'<button id="leaveServer" class="primary" style="background:#a53f50">Leave server</button>'}<div class="inline-note">Server settings and roles are local prototype data; they are not enforced by a remote server.</div>`,()=>{if(!can(s,'manage'))return closeModal();const name=$('serverNameEdit').value.trim();if(!name)return toast('Server name is required.','bad');s.name=name;s.description=$('serverDescEdit').value.trim();s.icon=$('serverIconEdit').value.trim();save();closeModal();renderShell();renderView()},'Save changes');$('copyInvite').onclick=()=>{const v=$('inviteLink').value;navigator.clipboard?.writeText(v).then(()=>toast('Invite copied.','good')).catch(()=>toast(v))};if($('manageRoles'))$('manageRoles').onclick=()=>{closeModal();manageRoles(s)};if($('deleteServer'))$('deleteServer').onclick=()=>{delete db.servers[id];for(const k of Object.keys(db.users))db.users[k].servers=(db.users[k].servers||[]).filter(x=>x!==id);save();closeModal();view={type:'home',id:null};renderShell();renderView()};if($('leaveServer'))$('leaveServer').onclick=()=>{user().servers=user().servers.filter(x=>x!==id);s.members=s.members.filter(x=>x!==current);delete s.memberRoles[current];save();closeModal();view={type:'home',id:null};renderShell();renderView()}}
function manageRoles(s){const users=s.members.filter(k=>db.users[k]);const myRank=s.owner===current?1000:rank(s),rankOf=k=>s.roles.find(r=>r.name===(s.memberRoles[k]||'Member'))?.rank||0;openModal('Manage roles',`<div class="setting-block"><h4>Create a role</h4><div class="row"><input id="roleNewName" class="field" placeholder="Role name"><input id="roleNewRank" class="field" type="number" min="1" max="90" value="20" style="width:85px;flex:0 0 85px"></div><label class="toggle">Manage channels<input id="rolePermChannels" type="checkbox"></label><label class="toggle">Manage roles<input id="rolePermRoles" type="checkbox"></label><label class="toggle">Moderate messages<input id="rolePermMsgs" type="checkbox"></label><button class="primary" id="createRoleBtn">Create role</button></div><div class="setting-block"><h4>Assign roles</h4>${users.map(k=>`<label>${esc(db.users[k].username)}<select class="field" data-user-role="${esc(k)}" ${k===s.owner||rankOf(k)>=myRank?'disabled':''}>${s.roles.filter(r=>r.rank<myRank||r.name===(s.memberRoles[k]||'Member')).slice().sort((a,b)=>b.rank-a.rank).map(r=>`<option ${((s.memberRoles[k]||'Member')===r.name)?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>`).join('')}</div>`,()=>{document.querySelectorAll('[data-user-role]').forEach(sel=>{if(sel.dataset.userRole!==s.owner&&!sel.disabled)s.memberRoles[sel.dataset.userRole]=sel.value});save();closeModal();renderSide();renderView()},'Save roles');$('createRoleBtn').onclick=()=>{const name=$('roleNewName').value.trim(),r=Number($('roleNewRank').value);if(!name||s.roles.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('Enter a unique role name.','bad');s.roles.push({name,rank:Math.min(90,Math.max(1,r)),perms:[...($('rolePermChannels').checked?['channels']:[]),...($('rolePermRoles').checked?['roles']:[]),...($('rolePermMsgs').checked?['manageMessages']:[])]});save();closeModal();manageRoles(s)}}
function renderMembers(s){const m=$('members');m.innerHTML=`<div class="member-title">MEMBERS — ${s.members.length}</div>`;s.members.filter(k=>db.users[k]).forEach(k=>{const u=db.users[k],r=s.memberRoles[k]||'Member',el=document.createElement('div');el.className='member';el.innerHTML=`<img src="${avatar(u)}"><span class="mname">${esc(u.username)}<div class="small muted">${esc(r)}</div></span>${k===current?'<span class="online-dot"></span>':''}`;el.onclick=()=>profile(k);m.append(el)})}
$('searchBox').oninput=()=>{const q=$('searchBox').value.toLowerCase();document.querySelectorAll('.message').forEach(m=>m.classList.toggle('hidden',!m.innerText.toLowerCase().includes(q)))};
function init(){if(db.session&&db.users[db.session]){current=db.session;showApp();ensureClaim(current)}else{$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}
window.addEventListener('storage',()=>{db=loadDB();if(current&&db.users[current]){renderShell();renderView()}});init();
})();
</script></body></html>
