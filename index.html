
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      overflow: hidden;
    }

    iframe {
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://www.yapper.website/"
    title="Web content"
    allowfullscreen>
  </iframe>
</body>
</html>
