
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab</title>
<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  height: 100vh;
  margin: 0;
}
button {
  padding: 16px 40px;
  font-size: 20px;
  border: 0;
  border-radius: 12px;
  cursor: pointer;
  background: #5865f2;
  color: white;
}
</style>
</head>
<body>
<button onclick="openBlank()">Hello</button>

<script>
function openBlank() {
  const win = window.open("about:blank", "_blank");

  if (!win) {
    alert("Allow pop-ups and try again.");
    return;
  }

  win.document.open();
  win.document.write(`
    <!DOCTYPE html>
    <html>
    <head><title>New Tab</title></head>
    <body style="margin:0">
      <iframe
        src="https://www.yapper.website/"
        style="width:100%;height:100vh;border:0"
        allowfullscreen>
      </iframe>
    </body>
    </html>
  `);
  win.document.close();
}
</script>
</body>
</html>
