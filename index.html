<section class="auth" id="auth"><div class="authbox"><div class="brand"><div class="logo">f</div> flapchat</div><h2 id="authTitle">Welcome back!</h2><p class="sub" id="authSub">We're so glad to see you again.</p><form id="authForm"><div class="field"><label>Username</label><input id="authUser" required maxlength="24" autocomplete="username" placeholder="your_username" pattern="[A-Za-z0-9_-]{2,24}" title="2–24 characters: letters, numbers, _ and - only"></div><div class="field"><label>Password</label><input id="authPass" required minlength="6" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div><div class="field hidden" id="confirmField"><label>Confirm password</label><input id="authConfirm" type="password" minlength="6" placeholder="Repeat password"></div><div class="error" id="authError" aria-live="polite"></div><button class="primary" id="authSubmit">Log In</button></form><div class="authswitch"><span id="authSwitchText">Need an account?</span> <button class="linkbtn" id="authSwitch">Register</button></div></div></section>
<div class="app hidden" id="app"><aside class="servers" id="serverRail"><button class="servericon active" title="Direct messages" data-view="home">f</button><div class="railsep"></div><div id="serverIcons"></div><button class="servericon plus" id="addServer" title="Create or join a server">+</button></aside><aside class="sidebar"><div class="sidehead"><span id="sideTitle">Direct Messages</span><button class="iconbtn" id="sideAdd" title="New message">＋</button></div><div class="sidebody" id="sidebody"></div><div class="userpanel"><div class="avatar" id="myAvatar">U</div><div class="userinfo"><strong id="myName">User</strong><small id="myStatus">Online</small></div><button class="iconbtn" id="editProfile" title="Edit profile">⚙</button><button class="iconbtn" id="logout" title="Log out">⇥</button></div></aside><main class="main"><div class="topbar"><span id="topIcon">✉</span><strong id="topTitle">Friends</strong><span class="desc" id="topDesc">Your people, all in one place</span><div class="topactions"><input class="search" id="searchInput" placeholder="Search users / messages"><button class="iconbtn" id="searchBtn" title="Search">⌕</button><button class="iconbtn" id="inboxBtn" title="Friend requests / inbox">♧</button><button class="iconbtn" id="themeBtn" title="Appearance">◐</button></div></div><div class="chat"><section class="chatcol" id="content"><div class="welcome"><div class="biglogo">f</div><h2>Welcome to Flapchat</h2><p>Choose a direct message or server, or find people by username.</p><button class="primary" id="findPeople" style="max-width:220px">Find people</button></div></section><aside class="rightbar hidden" id="rightbar"><h3>Members</h3><div id="members"></div></aside></div></main></div><div class="modalback hidden" id="modalback"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div><div class="toastwrap" id="toasts" aria-live="polite"></div><input type="file" id="fileInput" accept="image/*,image/gif" class="hidden">
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const DB='flapchat_v1';let db=load(),user=null,view='home',activeServer=null,activeChannel=null,activeDM=null,registering=false,peerConnections=new Map(),ws=null,peerId='',directory=new Map(),pendingIce=new Map(),soundOn=true;const SIGNAL='wss://wss.getlost.ovh',GLOBAL='flapchat-public-directory-v1',ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function load(){try{const x=JSON.parse(localStorage.getItem(DB))||{};x.accounts=x.accounts||{};x.servers=x.servers||{};x.session=x.session||null;return x}catch{return{accounts:{},servers:{},session:null}}}function save(){try{localStorage.setItem(DB,JSON.stringify(db))}catch(e){toast('Storage full','Some data could not be saved. Try smaller images.')}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}function initial(s='?'){return [...s][0]?.toUpperCase()||'?'}function avatarHtml(a,size=''){return `<div class="avatar ${size}">${a?.avatar?`<img src="${esc(a.avatar)}" alt="">`:esc(initial(a?.username||'User'))}</div>`}function me(){return user?db.accounts[user]:null}function toast(title,body=''){const e=document.createElement('div');e.className='toast';e.innerHTML=`<strong>${esc(title)}</strong><span>${esc(body)}</span>`;$('toasts').append(e);if(soundOn)beep();setTimeout(()=>e.remove(),4300)}function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=740;g.gain.value=.04;o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close()}catch{}}function modal(html){$('modal').innerHTML=html;$('modalback').classList.remove('hidden')}function closeModal(){$('modalback').classList.add('hidden');$('modal').innerHTML=''}$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))closeModal()});
function switchAuth(){registering=!registering;$('authTitle').textContent=registering?'Create an account':'Welcome back!';$('authSub').textContent=registering?'Set up your Flapchat profile.':'We’re glad to see you again.';$('confirmField').classList.toggle('hidden',!registering);$('authConfirm').required=registering;$('authSubmit').textContent=registering?'Create Account':'Log In';$('authSwitchText').textContent=registering?'Already have an account?':'Need an account?';$('authSwitch').textContent=registering?'Log In':'Register';$('authError').textContent=''}$('authSwitch').onclick=switchAuth;
$('authForm').addEventListener('submit',e=>{e.preventDefault();const name=$('authUser').value.trim(),pass=$('authPass').value;if(!/^[A-Za-z0-9_-]{2,24}$/.test(name))return err('Username must be 2–24 characters using letters, numbers, _ or - only.');const key=name.toLowerCase();if(registering){if(db.accounts[key])return err('That username is already taken in this browser.');if(pass.length<6)return err('Password must be at least 6 characters.');if(pass!==$('authConfirm').value)return err('Passwords do not match.');db.accounts[key]={username:name,password:pass,description:'',avatar:'',created:Date.now(),friends:[],requests:[],servers:[],dms:{},notifications:[],wallpaper:'dark',blocked:[],roles:{},ownedServers:[]};db.session=key;save();user=key;enterApp();toast('Account created','Welcome to Flapchat.')}else{if(!db.accounts[key]||db.accounts[key].password!==pass)return err('Incorrect username or password.');db.session=key;save();user=key;enterApp()}});function err(s){$('authError').textContent=s}
function enterApp(){user=db.session;if(!user||!db.accounts[user])return;db=db||load();$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('myName').textContent=me().username;$('myAvatar').innerHTML=me().avatar?`<img src="${esc(me().avatar)}">`:esc(initial(me().username));applyTheme();render();connectDirectory();}
$('logout').onclick=()=>{if(ws)try{ws.close()}catch{}for(const p of peerConnections.values())try{p.pc.close()}catch{}peerConnections.clear();db.session=null;save();user=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('authPass').value='';$('authConfirm').value='';};
function applyTheme(){const t=me()?.wallpaper||'dark';document.body.dataset.theme=t;const root=document.documentElement;if(t==='galaxy'){root.style.setProperty('--bg','#151528');root.style.setProperty('--side','#1c1c31');root.style.setProperty('--deep','#11111f');root.style.setProperty('--panel','#22223a');root.style.setProperty('--accent','#7774e8')}else if(t==='blue'){root.style.setProperty('--bg','#202c3d');root.style.setProperty('--side','#1b2636');root.style.setProperty('--deep','#111b29');root.style.setProperty('--panel','#1d2939');root.style.setProperty('--accent','#528bdb')}else{root.style.setProperty('--bg','#313338');root.style.setProperty('--side','#2b2d31');root.style.setProperty('--deep','#1e1f22');root.style.setProperty('--panel','#232428');root.style.setProperty('--accent','#5865f2')}}
function render(){if(!user)return;renderRail();renderSidebar();renderMain();$('myName').textContent=me().username;$('myAvatar').innerHTML=me().avatar?`<img src="${esc(me().avatar)}">`:esc(initial(me().username));}
function renderRail(){const host=$('serverIcons');host.innerHTML='';me().servers.forEach(sid=>{const s=db.servers?.[sid];if(!s)return;const b=document.createElement('button');b.className='servericon'+(view==='server'&&activeServer===sid?' active':'');b.title=s.name;b.textContent=s.icon||initial(s.name);b.onclick=()=>{view='server';activeServer=sid;activeChannel=s.channels[0]?.id||null;activeDM=null;render()};host.append(b)});document.querySelector('[data-view="home"]').onclick=()=>{view='home';activeServer=null;activeChannel=null;render()}}
function renderSidebar(){const host=$('sidebody');if(view==='server'&&activeServer&&db.servers?.[activeServer]){const s=db.servers[activeServer];$('sideTitle').textContent=s.name;host.innerHTML=`<div class="sectiontitle">Text channels <button class="tiny" id="addChannel" title="Create channel">＋</button></div>`+s.channels.map(c=>`<button class="channel ${activeChannel===c.id?'active':''}" data-channel="${esc(c.id)}"><span class="hash">#</span><span>${esc(c.name)}</span></button>`).join('')+`<div class="sectiontitle">Server</div><button class="navitem" id="serverInvite">↗ Invite people</button><button class="navitem" id="serverProfile">⚙ Server settings</button><button class="navitem" id="serverRoles">♜ Roles & members</button><button class="navitem" id="leaveServer">⇥ Leave server</button>`;host.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{activeChannel=b.dataset.channel;render()});$('addChannel').onclick=channelModal;$('serverInvite').onclick=inviteModal;$('serverProfile').onclick=serverEditModal;$('serverRoles').onclick=rolesModal;$('leaveServer').onclick=()=>{if(!confirm('Leave this server?'))return;me().servers=me().servers.filter(x=>x!==activeServer);save();activeServer=null;view='home';render()};return}
$('sideTitle').textContent='Direct Messages';host.innerHTML=`<button class="navitem ${view==='home'?'active':''}" id="friendsNav"><span>♙</span> Friends</button><button class="navitem" id="requestsNav"><span>♧</span> Friend requests ${me().requests.length?`<span class="badge">${me().requests.length}</span>`:''}</button><button class="navitem" id="discoverNav"><span>⌕</span> Find people</button><div class="sectiontitle">Direct messages <button class="tiny" id="newDM" title="New direct message">＋</button></div>`+me().friends.map(k=>{const a=db.accounts[k];if(!a)return'';return `<button class="person ${view==='dm'&&activeDM===k?'active':''}" data-dm="${esc(k)}">${avatarHtml(a)}<span class="meta"><strong>${esc(a.username)}</strong><small>${directory.has(k)?'Online':'Direct message'}</small></span></button>`}).join('')+(me().friends.length?'':'<div class="empty">Add friends to start direct messages.</div>');$('friendsNav').onclick=()=>{view='home';activeDM=null;render()};$('requestsNav').onclick=requestsModal;$('discoverNav').onclick=searchModal;$('newDM').onclick=searchModal;host.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{activeDM=b.dataset.dm;view='dm';render()})}
function renderMain(){const content=$('content');$('rightbar').classList.add('hidden');if(view==='server'&&activeServer&&db.servers?.[activeServer]){const s=db.servers[activeServer],c=s.channels.find(x=>x.id===activeChannel)||s.channels[0];$('topIcon').textContent='#';$('topTitle').textContent=c?.name||'channel';$('topDesc').textContent=s.name;content.innerHTML=chatMarkup();renderChat();const mem=$('members');$('rightbar').classList.remove('hidden');$('rightbar').querySelector('h3').textContent=`Members — ${s.members.length}`;mem.innerHTML=s.members.map(k=>{const a=db.accounts[k]||{username:k};return `<div class="rightperson">${avatarHtml(a)}<div class="details"><strong>${esc(a.username)}</strong><small>${esc(s.roles?.[k]||'Member')}</small></div><button data-profile="${esc(k)}" title="View profile">···</button></div>`}).join('');mem.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>profileModal(b.dataset.profile));return}
if(view==='dm'&&activeDM){const a=db.accounts[activeDM]||directory.get(activeDM)||{username:activeDM};$('topIcon').textContent='@';$('topTitle').textContent=a.username;$('topDesc').textContent='Direct message';content.innerHTML=chatMarkup();renderChat();return}
$('topIcon').textContent='♙';$('topTitle').textContent=view==='discover'?'Find people':view==='requests'?'Friend requests':'Friends';$('topDesc').textContent='Your people, all in one place';content.innerHTML=`<div class="welcome"><div class="biglogo">f</div><h2>${view==='requests'?'Friend requests':view==='discover'?'Find people':'Welcome to Flapchat'}</h2><p>${view==='requests'?'Review incoming requests.':view==='discover'?'Search for a username to view profiles and send friend requests.':'Choose a direct message or server, or find people by username.'}</p><button class="primary" id="findPeopleMain" style="max-width:220px">Find people</button><p class="filehint">Network discovery only works while users are online and connected.</p></div>`;$('findPeopleMain').onclick=searchModal}
function chatMarkup(){return `<div class="messages" id="messages"></div><div class="composerwrap"><form class="composer" id="composer"><button type="button" id="attach" title="Attach image or GIF">＋</button><input id="messageInput" maxlength="4000" autocomplete="off" placeholder="Message #channel"><button type="button" id="emojiBtn" title="Insert emoji">☺</button><button class="sendbtn" type="submit" title="Send">➤</button></form><div class="filehint">Enter to send · Images and GIFs can be attached · Messages save in this browser</div></div>`}
function getThread(){if(view==='dm'){const k=activeDM;me().dms[k]=me().dms[k]||[];return me().dms[k]}const s=db.servers?.[activeServer];if(!s)return[];s.messages=s.messages||{};s.messages[activeChannel]=s.messages[activeChannel]||[];return s.messages[activeChannel]}
function renderChat(){const box=$('messages');if(!box)return;const thread=getThread();if(!thread.length){box.innerHTML='<div class="welcome"><h2>Welcome!</h2><p>This is the beginning of this conversation.</p></div>'}else{box.innerHTML='<div class="dayline">MESSAGES</div>'+thread.map(m=>{const a=db.accounts[m.from]||directory.get(m.from)||{username:m.name||m.from,avatar:''};return `<div class="message">${avatarHtml(a)}<div class="msgbody"><div class="msghead"><strong>${esc(m.name||a.username)}</strong><time>${new Date(m.time).toLocaleString([], {hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'})}</time></div><div class="msgtext">${esc(m.text||'')}${m.image?`<img src="${esc(m.image)}" alt="Attachment" loading="lazy">`:''}</div></div></div>`}).join('')};box.scrollTop=box.scrollHeight;$('messageInput').placeholder=view==='dm'?`Message @${activeDM}`:`Message #${db.servers?.[activeServer]?.channels.find(c=>c.id===activeChannel)?.name||'channel'}`;$('composer').onsubmit=e=>{e.preventDefault();sendMessage()};$('attach').onclick=()=>$('fileInput').click();$('emojiBtn').onclick=()=>{const inp=$('messageInput');inp.value+=' 🙂';inp.focus()}}
function sendMessage(image=''){const inp=$('messageInput'),text=inp.value.trim();if(!text&&!image)return;const item={id:id(),from:user,name:me().username,text,image,time:Date.now()};const thread=getThread();thread.push(item);save();renderChat();if(view==='dm')sendToPeer(activeDM,{kind:'dm',message:item});else{const s=db.servers?.[activeServer];if(s){s.members.forEach(k=>{if(k!==user)sendToPeer(k,{kind:'server-message',serverId:s.id,channelId:activeChannel,message:item})});save()}}inp.value=''}
$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Unsupported file','Choose an image or GIF.');return}if(f.size>1_500_000){toast('Image too large','Choose an image under 1.5 MB for local storage.');return}const r=new FileReader();r.onload=()=>sendMessage(String(r.result));r.readAsDataURL(f);e.target.value=''};
function searchModal(){modal(`<h2>Find people</h2><p>Search online peers by exact username. Users need to be online in Flapchat for WebRTC discovery.</p><div class="field"><label>Username</label><input id="userSearch" placeholder="username" autocomplete="off"></div><div id="searchResults"></div><div class="modalactions"><button id="searchClose">Close</button><button class="primarybtn" id="doSearch">Search</button></div>`);$('searchClose').onclick=closeModal;$('doSearch').onclick=doSearch;$('userSearch').onkeydown=e=>{if(e.key==='Enter')doSearch()};$('userSearch').focus();}
function doSearch(){const q=$('userSearch').value.trim().toLowerCase();const out=$('searchResults');if(!q){out.innerHTML='<p>Enter a username.</p>';return}const found=[...directory.entries()].filter(([k,a])=>k===q||a.username.toLowerCase().includes(q));if(!found.length){out.innerHTML='<p>No online users found. Ask them to open Flapchat and join the network.</p>';return}out.innerHTML=found.map(([k,a])=>`<div class="rightperson">${avatarHtml(a)}<div class="details"><strong>${esc(a.username)}</strong><small>${esc(a.description||'No description')}</small></div><button class="iconbtn" data-prof="${esc(k)}">Profile</button><button class="iconbtn" data-add="${esc(k)}">＋</button></div>`).join('');out.querySelectorAll('[data-prof]').forEach(b=>b.onclick=()=>profileModal(b.dataset.prof));out.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>friendRequest(b.dataset.add));}
function friendRequest(k){if(k===user)return toast('That is you','You cannot add yourself.');if(me().friends.includes(k))return toast('Already friends','This user is already on your friends list.');if(!directory.has(k))return toast('User offline','Friend requests can only be delivered to connected users in this prototype.');sendToPeer(k,{kind:'friend-request',from:user,profile:publicProfile()});toast('Request sent','The user must be online to receive it.');}
function publicProfile(){const a=me();return{username:a.username,description:a.description||'',avatar:a.avatar||''}}
function requestsModal(){const req=me().requests;modal(`<h2>Friend requests</h2><p>Incoming requests received while you were online.</p><div id="reqList">${req.length?req.map((r,i)=>`<div class="rightperson">${avatarHtml(r.profile||{username:r.from})}<div class="details"><strong>${esc(r.profile?.username||r.from)}</strong><small>${esc(r.profile?.description||'Wants to connect')}</small></div><button class="iconbtn" data-accept="${i}">✓</button><button class="iconbtn" data-decline="${i}">×</button></div>`).join(''):'<div class="empty">No pending requests.</div>'}</div><div class="modalactions"><button id="reqClose">Close</button></div>`);$('reqClose').onclick=closeModal;$('modal').querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{const r=me().requests[+b.dataset.accept];if(!r)return;me().friends=[...new Set([...me().friends,r.from])];sendToPeer(r.from,{kind:'friend-accepted',from:user,profile:publicProfile()});me().requests.splice(+b.dataset.accept,1);save();closeModal();render();toast('Friend added',r.profile?.username||r.from)});$('modal').querySelectorAll('[data-decline]').forEach(b=>b.onclick=()=>{me().requests.splice(+b.dataset.decline,1);save();requestsModal();render()})}
function profileModal(k){const a=db.accounts[k]||directory.get(k)||{username:k,description:'',avatar:''};const isFriend=me().friends.includes(k);modal(`<div class="profilehero">${avatarHtml(a)}<div><h3>${esc(a.username)}</h3><p>@${esc(a.username)}</p></div></div><h3>About me</h3><p>${esc(a.description||'This user has not added a description.')}</p><p class="filehint">${directory.has(k)?'Online now':'Offline or not discovered'}</p><div class="modalactions"><button id="profileClose">Close</button>${k!==user&&!isFriend?`<button class="primarybtn" id="profileAdd">Send friend request</button>`:''}${k!==user&&isFriend?`<button class="primarybtn" id="profileDM">Message</button>`:''}</div>`);$('profileClose').onclick=closeModal;if($('profileAdd'))$('profileAdd').onclick=()=>{closeModal();friendRequest(k)};if($('profileDM'))$('profileDM').onclick=()=>{closeModal();activeDM=k;view='dm';render()}}
function editProfileModal(){const a=me();modal(`<h2>Edit profile</h2><div class="field"><label>Username</label><input id="editUsername" maxlength="24" pattern="[A-Za-z0-9_-]{2,24}" value="${esc(a.username)}"></div><div class="field"><label>About me</label><textarea id="editDescription" rows="3" maxlength="190" placeholder="Tell people about yourself">${esc(a.description||'')}</textarea></div><div class="field"><label>Profile picture</label><input id="editAvatar" type="file" accept="image/*"><small class="filehint">PNG, JPG or GIF under 500 KB.</small></div><div class="modalactions"><button id="profileCancel">Cancel</button><button class="primarybtn" id="profileSave">Save changes</button></div>`);$('profileCancel').onclick=closeModal;$('profileSave').onclick=()=>{const n=$('editUsername').value.trim();if(!/^[A-Za-z0-9_-]{2,24}$/.test(n))return toast('Invalid username','Use 2–24 letters, numbers, _ or -.');const nk=n.toLowerCase();if(nk!==user&&db.accounts[nk])return toast('Username taken','Choose another username.');const file=$('editAvatar').files?.[0];const commit=avatar=>{if(nk!==user){db.accounts[nk]=a;delete db.accounts[user];user=nk;db.session=nk;a.username=n}a.description=$('editDescription').value.trim();if(avatar)a.avatar=avatar;save();closeModal();render();broadcastProfile();toast('Profile updated','Changes saved in this browser.')};if(file){if(file.size>500000)return toast('Image too large','Choose an image under 500 KB.');const r=new FileReader();r.onload=()=>commit(String(r.result));r.readAsDataURL(file)}else commit('')}}
$('editProfile').onclick=editProfileModal;$('themeBtn').onclick=themeModal;function themeModal(){modal(`<h2>Appearance</h2><p>Choose a local background theme.</p><div class="themegrid"><button class="themechoice" data-theme="dark"><i></i>Dark</button><button class="themechoice" data-theme="blue"><i></i>Blue night</button><button class="themechoice" data-theme="galaxy"><i></i>Dark galaxy</button></div><div class="field"><label>Notifications</label><select id="soundSetting"><option value="on">Sound on</option><option value="off">Sound off</option></select></div><div class="modalactions"><button id="themeClose">Close</button></div>`);document.querySelectorAll('[data-theme]').forEach(b=>{b.classList.toggle('active',b.dataset.theme===(me().wallpaper||'dark'));b.onclick=()=>{me().wallpaper=b.dataset.theme;save();applyTheme();document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b))}});$('soundSetting').value=soundOn?'on':'off';$('soundSetting').onchange=()=>soundOn=$('soundSetting').value==='on';$('themeClose').onclick=closeModal}
function serverModal(){modal(`<h2>Create or join a server</h2><p>Create a local server or paste a server invite link.</p><div class="field"><label>Server name</label><input id="newServerName" maxlength="40" placeholder="My community"></div><div class="field"><label>Server icon (one character)</label><input id="newServerIcon" maxlength="2" placeholder="F"></div><button class="primary" id="createServer">Create server</button><div class="field" style="margin-top:23px"><label>Join with invite link</label><input id="inviteCode" placeholder="flapchat://server/abc123"></div><button class="primary" id="joinServer">Join server</button><div class="modalactions"><button id="serverModalClose">Close</button></div>`);$('serverModalClose').onclick=closeModal;$('createServer').onclick=()=>{const name=$('newServerName').value.trim();if(!name)return toast('Name required','Enter a server name.');const sid=id(),s={id:sid,name,icon:$('newServerIcon').value.trim()||initial(name),owner:user,members:[user],roles:{[user]:'Owner'},roleDefs:[{name:'Admin',rank:2},{name:'Moderator',rank:1},{name:'Member',rank:0}],channels:[{id:id(),name:'general',minRank:0}],messages:{}};db.servers=db.servers||{};db.servers[sid]=s;me().servers.push(sid);me().ownedServers.push(sid);save();closeModal();view='server';activeServer=sid;activeChannel=s.channels[0].id;render();toast('Server created','Invite link: flapchat://server/'+sid)};$('joinServer').onclick=()=>joinServer($('inviteCode').value.trim())}
$('addServer').onclick=serverModal;$('sideAdd').onclick=()=>view==='server'?channelModal():searchModal();function inviteModal(){const s=db.servers?.[activeServer];if(!s)return;const link='flapchat://server/'+s.id;modal(`<h2>Invite people</h2><p>Share this server link with someone. In this prototype, the invite works only when the server record is available in the same browser.</p><div class="field"><label>Server invite link</label><input id="serverLink" readonly value="${esc(link)}"></div><div class="modalactions"><button id="inviteClose">Close</button><button class="primarybtn" id="copyInvite">Copy link</button></div>`);$('inviteClose').onclick=closeModal;$('copyInvite').onclick=()=>{navigator.clipboard?.writeText(link).then(()=>toast('Copied','Invite link copied.')).catch(()=>toast('Invite link',link));if(!navigator.clipboard)toast('Invite link',link)}}function joinServer(link){const m=link.match(/(?:flapchat:\/\/server\/|server\.fc\/)([A-Za-z0-9_-]+)/);if(!m)return toast('Invalid invite','Paste a flapchat://server/… link.');const s=db.servers?.[m[1]];if(!s)return toast('Server not found','This invite is not in this browser’s saved server list. Cross-device server invites need a hosted directory.');if(!s.members.includes(user))s.members.push(user);if(!me().servers.includes(s.id))me().servers.push(s.id);save();closeModal();view='server';activeServer=s.id;activeChannel=s.channels[0]?.id;render();toast('Joined server',s.name)}
function channelModal(){const s=db.servers?.[activeServer];if(!s)return;if(s.owner!==user)return toast('No permission','Only the owner can create channels in this prototype.');modal(`<h2>Create channel</h2><div class="field"><label>Channel name</label><input id="channelName" maxlength="40" placeholder="announcements"></div><div class="field"><label>Minimum role</label><select id="channelRole"><option value="0">Everyone</option><option value="1">Moderator or higher</option><option value="2">Admin or owner</option></select></div><div class="modalactions"><button id="channelCancel">Cancel</button><button class="primarybtn" id="channelCreate">Create channel</button></div>`);$('channelCancel').onclick=closeModal;$('channelCreate').onclick=()=>{const n=$('channelName').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-');if(!n)return toast('Name required','Enter a channel name.');if(s.channels.some(c=>c.name===n))return toast('Already exists','Choose another channel name.');s.channels.push({id:id(),name:n,minRank:+$('channelRole').value});save();closeModal();activeChannel=s.channels.at(-1).id;render()}}
function serverEditModal(){const s=db.servers?.[activeServer];if(!s)return;if(s.owner!==user)return toast('No permission','Only the owner can edit server settings.');modal(`<h2>Server settings</h2><div class="field"><label>Server name</label><input id="serverNameEdit" maxlength="40" value="${esc(s.name)}"></div><div class="field"><label>Server icon</label><input id="serverIconEdit" maxlength="2" value="${esc(s.icon||'')}"></div><div class="modalactions"><button id="serverEditCancel">Cancel</button><button class="primarybtn" id="serverEditSave">Save</button></div>`);$('serverEditCancel').onclick=closeModal;$('serverEditSave').onclick=()=>{s.name=$('serverNameEdit').value.trim()||s.name;s.icon=$('serverIconEdit').value.trim()||initial(s.name);save();closeModal();render()}}
function rolesModal(){const s=db.servers?.[activeServer];if(!s)return;const owner=s.owner===user;modal(`<h2>Roles & members</h2><p>Owner: ${esc(db.accounts[s.owner]?.username||s.owner)}. Role changes here are local to this browser.</p><div id="roleMembers">${s.members.map(k=>`<div class="rightperson">${avatarHtml(db.accounts[k]||{username:k})}<div class="details"><strong>${esc(db.accounts[k]?.username||k)}</strong><small>${esc(s.roles[k]||'Member')}</small></div>${owner&&k!==s.owner?`<select data-roleuser="${esc(k)}"><option ${s.roles[k]==='Member'?'selected':''}>Member</option><option ${s.roles[k]==='Moderator'?'selected':''}>Moderator</option><option ${s.roles[k]==='Admin'?'selected':''}>Admin</option></select>`:''}</div>`).join('')}</div><div class="modalactions"><button id="rolesClose">Close</button><button id="rolesSave" class="primarybtn">Save roles</button></div>`);$('rolesClose').onclick=closeModal;$('rolesSave').onclick=()=>{if(owner)$('modal').querySelectorAll('[data-roleuser]').forEach(sel=>s.roles[sel.dataset.roleuser]=sel.value);save();closeModal();render();toast('Roles saved','Role changes saved locally.')};}
function broadcastProfile(){for(const k of peerConnections.keys())sendToPeer(k,{kind:'profile',profile:publicProfile()})}
function connectDirectory(){if(!user||ws)return;peerId=id();try{ws=new WebSocket(SIGNAL)}catch{toast('Network unavailable','Local chat features still work.');return}ws.onopen=()=>{ws.send(JSON.stringify({roomId:GLOBAL,from:peerId,announce:true}));$('myStatus').textContent='Online'};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}handleSignal(d)};ws.onerror=()=>{$('myStatus').textContent='Offline';};ws.onclose=()=>{ws=null;$('myStatus').textContent='Offline';peerConnections.forEach(p=>{try{p.pc.close()}catch{}});peerConnections.clear();directory.clear();if(user)setTimeout(connectDirectory,7000)}}
function signal(o){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({roomId:GLOBAL,...o}))}function handleSignal(d){if(!d||d.from===peerId)return;if(d.sys==='roster'&&Array.isArray(d.roster)){for(const pid of d.roster){if(typeof pid==='string'&&pid!==peerId&&!peerConnections.has(pid)&&peerId.localeCompare(pid)<0)makePeer(pid,true)}for(const [pid,p] of peerConnections){if(!d.roster.includes(pid)){try{p.pc.close()}catch{}peerConnections.delete(pid)}}return}if(!d.from)return;const p=peerConnections.get(d.from);if(d.type==='offer'){let peer=p||makePeer(d.from,false);if(!peer)return;peer.pc.setRemoteDescription({type:'offer',sdp:d.sdp}).then(async()=>{for(const c of peer.pending.splice(0))try{await peer.pc.addIceCandidate(c)}catch{}const ans=await peer.pc.createAnswer();await peer.pc.setLocalDescription(ans);signal({to:d.from,from:peerId,type:'answer',sdp:peer.pc.localDescription.sdp})}).catch(()=>{})}else if(d.type==='answer'&&p){p.pc.setRemoteDescription({type:'answer',sdp:d.sdp}).then(async()=>{for(const c of p.pending.splice(0))try{await p.pc.addIceCandidate(c)}catch{}}).catch(()=>{})}else if(d.type==='candidate'&&p){if(p.pc.remoteDescription)p.pc.addIceCandidate(d.candidate).catch(()=>{});else p.pending.push(d.candidate)}}
function makePeer(pid,initiator){if(peerConnections.has(pid))return peerConnections.get(pid);const pc=new RTCPeerConnection(ICE),p={pc,dc:null,pending:[]};peerConnections.set(pid,p);pc.onicecandidate=e=>{if(e.candidate)signal({to:pid,from:peerId,type:'candidate',candidate:e.candidate})};pc.ondatachannel=e=>setupDC(pid,e.channel);pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)){peerConnections.delete(pid);directory.delete(pid);renderSidebar()}};if(initiator){setupDC(pid,pc.createDataChannel('flapchat'));pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>signal({to:pid,from:peerId,type:'offer',sdp:pc.localDescription.sdp})).catch(()=>{})}return p}
function setupDC(pid,dc){const p=peerConnections.get(pid);if(!p)return;p.dc=dc;dc.onopen=()=>{sendToPeer(pid,{kind:'profile',profile:publicProfile()});toast('Connected','A Flapchat peer connected.');};dc.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}receivePeer(pid,d)};dc.onclose=()=>{directory.delete(pid);renderSidebar()}}
function sendToPeer(k,payload){const peer=directory.get(k);const pid=peer?.peerId||k;let p=peerConnections.get(pid);if(!p){for(const [id,x] of peerConnections){if(x.usernameKey===k){p=x;break}}}if(p?.dc?.readyState==='open'){try{p.dc.send(JSON.stringify(payload));return true}catch{}}return false}
function receivePeer(pid,d){if(d.kind==='profile'&&d.profile?.username){const k=d.profile.username.toLowerCase();directory.set(k,{...d.profile,peerId:pid});const p=peerConnections.get(pid);if(p)p.usernameKey=k;renderSidebar();return}if(d.kind==='friend-request'){const k=String(d.from||'').toLowerCase();if(!k||k===user||me().friends.includes(k)||me().requests.some(x=>x.from===k))return;me().requests.push({from:k,profile:d.profile||{username:k},time:Date.now()});save();toast('Friend request',`${d.profile?.username||k} sent you a request.`);renderSidebar();return}if(d.kind==='friend-accepted'){const k=String(d.from||'').toLowerCase();if(k&&k!==user&&!me().friends.includes(k)){me().friends.push(k);save();toast('Friend request accepted',d.profile?.username||k);renderSidebar()}return}if(d.kind==='dm'&&d.message){const k=String(d.message.from||pid).toLowerCase();me().dms[k]=me().dms[k]||[];if(!me().dms[k].some(m=>m.id===d.message.id))me().dms[k].push(d.message);save();toast('Direct message',`${d.message.name||k}: ${d.message.text||'sent an image'}`);if(view==='dm'&&activeDM===k)renderChat();return}if(d.kind==='server-message'&&d.message){const s=db.servers?.[d.serverId];if(!s||!s.members.includes(user))return;s.messages=s.messages||{};s.messages[d.channelId]=s.messages[d.channelId]||[];if(!s.messages[d.channelId].some(m=>m.id===d.message.id))s.messages[d.channelId].push(d.message);save();toast('Server message',`${d.message.name||'Member'}: ${d.message.text||'sent an image'}`);if(view==='server'&&activeServer===d.serverId&&activeChannel===d.channelId)renderChat()}}
$('searchBtn').onclick=searchModal;$('inboxBtn').onclick=requestsModal;$('findPeople').onclick=searchModal;$('searchInput').onkeydown=e=>{if(e.key==='Enter'){searchModal();setTimeout(()=>{$('userSearch').value=$('searchInput').value;doSearch()},0)}};
if(db.session&&db.accounts[db.session]){user=db.session;enterApp()}
})();
</script></body></html>
