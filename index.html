<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Room — P2P Chat</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2f;--line:#2a3654;--text:#f0f3ff;--muted:#9ca9c9;--accent:#9ba8ff;--green:#73e2b1;--red:#ff9eaa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a2850,#0b1020 60%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:16px}
.app{width:min(780px,100%);height:min(850px,94vh);min-height:540px;background:rgba(20,27,47,.96);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px #0005}
header{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#a6b2ff,#8072ff);color:#11182c;display:grid;place-items:center;font-weight:900;font-size:22px}h1{font-size:19px;margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:12px}.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#e9b76d}.dot.on{background:var(--green)}
.settings{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.settings input{min-width:0;flex:1;background:#0b1122;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}.settings button,.sendrow button{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--accent);color:#0b1020}.settings button.secondary{background:#27324f;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.roominfo{padding:7px 21px;color:var(--muted);font-size:12px;border-bottom:1px solid #202b45;display:flex;justify-content:space-between;gap:10px}.messages{padding:18px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}.system{align-self:center;text-align:center;color:var(--muted);font-size:12px;padding:4px 8px}.bubble{max-width:84%;padding:10px 13px;border-radius:14px;background:#202b48;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#3a477d}.bubble .by{font-size:11px;font-weight:750;color:#bdc7ff;margin-bottom:3px}.bubble.mine .by{color:#dbe0ff}.bubble .time{font-size:10px;color:#c1cae3;margin-top:5px;text-align:right}.sendbox{padding:14px 16px;border-top:1px solid var(--line);background:#11182b}.sendrow{display:flex;gap:8px}.sendrow input{flex:1;min-width:0;background:#080e1d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;outline:none}.sendrow input:focus,.settings input:focus{border-color:var(--accent)}.fineprint{color:var(--muted);font-size:11px;margin:9px 3px 0}.warning{color:#e7c88d}.hidden{display:none}@media(max-width:500px){.app{height:96vh;min-height:0;border-radius:16px}header{padding:15px}.settings{padding:10px}.settings input{flex-basis:35%}.status{font-size:11px}.roominfo{padding:7px 14px}.messages{padding:13px}.bubble{max-width:92%}}
</style></head>
<body><main class="app">
<header><div class="logo">↗</div><div><h1>Open Room</h1><p>Public chat · WebRTC peer-to-peer messages</p></div><div class="status"><span class="dot" id="dot"></span><span id="status">Offline</span></div></header>
<div class="settings" id="settings"><input id="name" maxlength="24" placeholder="Your nickname" value="Guest" aria-label="Nickname"><input id="room" maxlength="48" placeholder="Public room name" value="public-lobby" aria-label="Public room"><button id="join">Join chat</button><button id="leave" class="secondary" disabled>Leave</button></div>
<div class="roominfo"><span id="roomLabel">Room: public-lobby</span><span id="people">0 people online</span></div>
<div class="messages" id="messages" aria-live="polite"><div class="system">Join the public room to start chatting.</div></div>
<div class="sendbox"><form class="sendrow" id="sendForm"><input id="text" maxlength="2000" placeholder="Write a message…" autocomplete="off" disabled aria-label="Message"><button id="send" disabled>Send</button></form><div class="fineprint" id="fineprint">Messages are sent directly between connected browsers after setup.</div></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);const messages=$('messages'),nameInput=$('name'),roomInput=$('room'),textInput=$('text');
const SIGNAL_URL='wss://wss.getlost.ovh'; // Public test-only signaling service
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let ws=null,joined=false,peerId='',roomName='',nickname='Guest',roster=new Set(),peers=new Map(),retryTimer=null;
function sys(t){const e=document.createElement('div');e.className='system';e.textContent=t;messages.appendChild(e);messages.scrollTop=messages.scrollHeight;}
function msg(who,body,mine=false){const e=document.createElement('div');e.className='bubble'+(mine?' mine':'');const by=document.createElement('div');by.className='by';by.textContent=who;const content=document.createElement('div');content.textContent=body;const tm=document.createElement('div');tm.className='time';tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});e.append(by,content,tm);messages.appendChild(e);messages.scrollTop=messages.scrollHeight;}
function setStatus(s,on=false){$('status').textContent=s;$('dot').className='dot'+(on?' on':'');}
function updatePeople(){const n=roster.size+1;$('people').textContent=n+' '+(n===1?'person':'people')+' online';}
function signal(obj){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({roomId:roomName,...obj}));}
function closePeer(id){const p=peers.get(id);if(p){try{p.dc&&p.dc.close()}catch{}try{p.pc.close()}catch{}peers.delete(id);}}
function leave(silent=false){joined=false;if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}if(ws){try{ws.close()}catch{}ws=null;}for(const id of [...peers.keys()])closePeer(id);roster.clear();textInput.disabled=true;$('send').disabled=true;$('join').disabled=false;$('leave').disabled=true;nameInput.disabled=false;roomInput.disabled=false;setStatus('Offline');updatePeople();if(!silent)sys('You left the room.');}
function setupDataChannel(id,dc){const p=peers.get(id);if(!p)return;p.dc=dc;dc.onopen=()=>{sys('Connected to a peer.');};dc.onclose=()=>{};dc.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='chat'&&typeof d.text==='string')msg(String(d.name||'Guest'),d.text,false);};}
function makePeer(id,initiator){if(id===peerId||peers.has(id))return;const pc=new RTCPeerConnection(ICE);const p={pc,dc:null,initiator,pendingCandidates:[]};peers.set(id,p);pc.onicecandidate=e=>{if(e.candidate)signal({to:id,from:peerId,type:'candidate',candidate:e.candidate});};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed'){closePeer(id);updatePeople();}};pc.ondatachannel=e=>setupDataChannel(id,e.channel);
if(initiator){setupDataChannel(id,pc.createDataChannel('chat',{ordered:true}));pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>signal({to:id,from:peerId,type:'offer',sdp:pc.localDescription.sdp})).catch(()=>{closePeer(id);});}
return p;}
async function onSignal(d){if(!d||d.from===peerId)return;
if(d.sys==='roster'&&Array.isArray(d.roster)){const next=new Set(d.roster.filter(x=>typeof x==='string'&&x!==peerId));for(const id of roster)if(!next.has(id)){closePeer(id);sys('A participant left.');}for(const id of next){if(!roster.has(id)){sys('A participant joined.');if(peerId.localeCompare(id)<0)makePeer(id,true);}}roster=next;updatePeople();return;}
if(!d.from||!roster.has(d.from))return;
try{
 if(d.type==='offer') {let p=peers.get(d.from);if(!p)p=makePeer(d.from,false);if(!p||p.pc.signalingState!=='stable')return;await p.pc.setRemoteDescription({type:'offer',sdp:d.sdp});for(const c of p.pendingCandidates.splice(0)){try{await p.pc.addIceCandidate(c)}catch{}}const answer=await p.pc.createAnswer();await p.pc.setLocalDescription(answer);signal({to:d.from,from:peerId,type:'answer',sdp:p.pc.localDescription.sdp});}
 else if(d.type==='answer'){const p=peers.get(d.from);if(p&&p.pc.signalingState==='have-local-offer'){await p.pc.setRemoteDescription({type:'answer',sdp:d.sdp});for(const c of p.pendingCandidates.splice(0)){try{await p.pc.addIceCandidate(c)}catch{}}}}
 else if(d.type==='candidate'){const p=peers.get(d.from);if(p&&d.candidate){if(p.pc.remoteDescription)await p.pc.addIceCandidate(d.candidate);else p.pendingCandidates.push(d.candidate);}}
}catch(e){console.warn('WebRTC signaling error',e);}
}
function join(){if(joined)return;nickname=(nameInput.value.trim()||'Guest').slice(0,24);roomName=(roomInput.value.trim()||'public-lobby').slice(0,48);peerId=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));joined=true;$('join').disabled=true;$('leave').disabled=false;nameInput.disabled=true;roomInput.disabled=true;$('roomLabel').textContent='Room: '+roomName;setStatus('Connecting…');$('fineprint').textContent='Connecting to the room. Chat messages travel peer-to-peer; the public service only helps peers find each other.';
try{ws=new WebSocket(SIGNAL_URL);}catch(e){joined=false;setStatus('Unavailable');sys('Could not open the signaling connection. Try again later.');$('join').disabled=false;$('leave').disabled=true;return;}
ws.onopen=()=>{if(!joined)return;setStatus('Joining…');signal({from:peerId,announce:true});textInput.disabled=false;$('send').disabled=false;textInput.focus();setStatus('In room',true);sys('Joined “'+roomName+'”. Public room: anyone using this room name can join.');};
ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}onSignal(d);};
ws.onerror=()=>{setStatus('Connection error');};
ws.onclose=()=>{if(joined){joined=false;for(const id of [...peers.keys()])closePeer(id);roster.clear();updatePeople();textInput.disabled=true;$('send').disabled=true;$('join').disabled=false;$('leave').disabled=true;nameInput.disabled=false;roomInput.disabled=false;setStatus('Offline');sys('Connection to the room was lost. Press Join chat to try again.');}};
}
$('join').onclick=join;$('leave').onclick=()=>leave();$('sendForm').addEventListener('submit',e=>{e.preventDefault();const text=textInput.value.trim();if(!text||!joined)return;msg(nickname,text,true);const payload=JSON.stringify({type:'chat',name:nickname,text});let sent=0;for(const p of peers.values()){if(p.dc&&p.dc.readyState==='open'){try{p.dc.send(payload);sent++;}catch{}}}if(!sent&&roster.size===0)sys('You are the only person connected right now. Your message was not delivered to anyone else.');else if(!sent)sys('Peers are still connecting; this message may not have reached everyone.');textInput.value='';textInput.focus();});
window.addEventListener('beforeunload',()=>{try{ws&&ws.close()}catch{}for(const p of peers.values())try{p.pc.close()}catch{}});
})();
</script></body></html>
